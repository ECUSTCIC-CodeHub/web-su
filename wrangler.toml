# Cloudflare Pages 项目配置
# 注意：Pages 项目通过 Dashboard 或 `wrangler pages deploy` 部署
# 不要用 `wrangler deploy`（那是部署 Worker 的命令）

name = "web-su"
compatibility_date = "2025-04-28"

# Pages 项目不需要 main 入口，Functions 目录自动识别
# KV 绑定在 Cloudflare Dashboard 中配置后即可在生产环境使用
# 本地开发时的 KV 绑定：
[[kv_namespaces]]
binding = "DEGREE_KV"
id = "2a1c2ced9f0940a2ae3d2d57b20f72b1"
